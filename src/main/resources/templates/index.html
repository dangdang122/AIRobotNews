<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Robot News | 최신 로봇 기술 동향</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; color: #333; margin: 0; background: #f8f9fa; }
        header { background: #1a1a1a; color: white; padding: 2rem 1rem; text-align: center; }
        nav { background: white; padding: 10px; text-align: right; border-bottom: 1px solid #ddd; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 5px solid #007bff; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .card h2 { margin-top: 0; color: #007bff; }
        .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
<header>
    <h1>AI ROBOT NEWS</h1>
    <p>최신 로봇 공학 및 인공지능 트렌드 업데이트</p>
</header>

<nav>
    <div th:if="${member == null}">
        <a href="/login" class="btn">로그인 / 회원가입</a>
    </div>
    <div th:if="${member != null}">
        <span th:text="${member.email} + '님 반갑습니다.'"></span>
        <a href="/logout">로그아웃</a>
    </div>
</nav>

<main class="container">
    <h2>실시간 주요 기술 소식</h2>
    <div class="news-grid">
        <article class="card" th:each="news : ${newsList}">
            <a th:href="@{/news/{title}(title=${news[0]})}" style="text-decoration:none; color:inherit;">
                <img th:src="@{'/images/' + ${news[3]}}" alt="뉴스 이미지">
                <h2 th:text="${news[0]}">제목</h2>
                <p th:text="${news[1]}">내용</p>
            </a>
        </article>
    </div>
</main>

<script th:if="${param.alert}">
    alert("[[${param.alert}]]");
    history.replaceState({}, null, location.pathname);
</script>
</body>
</html>
