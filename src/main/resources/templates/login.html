<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>AI Robot News - 로그인</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
    .auth-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
    h2 { text-align: center; color: #333; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .toggle-link { text-align: center; margin-top: 15px; font-size: 0.9em; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="auth-container">
  <div id="login-box">
    <h2>로그인</h2>
    <form action="/login" method="post">
      <input type="email" name="email" placeholder="이메일" required>
      <input type="password" name="password" placeholder="비밀번호" required>
      <button type="submit">로그인</button>
    </form>
    <div class="toggle-link">계정이 없으신가요? <a href="#" onclick="toggleAuth()">회원가입</a></div>
  </div>

  <div id="register-box" class="hidden">
    <h2>회원가입</h2>
    <form action="/register" method="post">
      <input type="email" name="email" placeholder="이메일" required>
      <input type="password" name="password" placeholder="비밀번호" required>
      <button type="submit">가입하기</button>
    </form>
    <div class="toggle-link">이미 계정이 있으신가요? <a href="#" onclick="toggleAuth()">로그인</a></div>
  </div>
</div>

<script>
  function toggleAuth() {
    document.getElementById('login-box').classList.toggle('hidden');
    document.getElementById('register-box').classList.toggle('hidden');
  }
</script>

<script th:if="${param.alert}">
  alert("[[${param.alert}]]");
  history.replaceState({}, null, location.pathname);
</script>
</body>
</html>
