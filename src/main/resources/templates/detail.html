<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Robot News | 상세 보기</title>
    <style>
        body { font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; color: #222; margin: 0; padding: 0; background-color: #fff; }
        header { border-bottom: 1px solid #e5e5e5; padding: 15px 0; text-align: center; }
        header a { text-decoration: none; color: #000; font-weight: bold; font-size: 24px; letter-spacing: -1px; }

        .article-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }

        .article-header { border-bottom: 2px solid #222; padding-bottom: 20px; margin-bottom: 30px; }
        .article-title { font-size: 32px; font-weight: 800; line-height: 1.4; margin: 0 0 15px 0; letter-spacing: -1.5px; }
        .article-meta { color: #666; font-size: 14px; display: flex; justify-content: space-between; }

        .article-content { font-size: 17px; line-height: 1.8; color: #333; letter-spacing: -0.5px; word-break: keep-all; }
        .article-content img { width: 100%; border-radius: 8px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .image-caption { text-align: center; font-size: 13px; color: #888; margin-top: -10px; margin-bottom: 30px; }

        .email-section { background-color: #f8f9fa; padding: 40px 20px; border-radius: 12px; margin-top: 50px; text-align: center; }
        .email-section h3 { margin: 0 0 15px 0; font-size: 18px; color: #333; }
        .email-form { display: flex; justify-content: center; gap: 10px; max-width: 400px; margin: 0 auto; }
        .email-form input[type="email"] { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
        .email-form input[type="email"]:focus { border-color: #007bff; }
        .email-form button { padding: 12px 24px; background-color: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .email-form button:hover { background-color: #0056b3; }

        .back-link { display: block; text-align: center; margin-top: 30px; margin-bottom: 50px; text-decoration: none; color: #555; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<header>
    <a href="/">AI ROBOT NEWS</a>
</header>

<main class="article-container">
    <div class="article-header">
        <h1 class="article-title" th:text="${news[0]}">기사 제목</h1>
        <div class="article-meta">
            <span>AI로봇기자</span>
            <span>2026.06.29</span>
        </div>
    </div>

    <div class="article-content">
        <img th:src="@{'/images/' + ${news[3]}}" alt="뉴스 이미지">
        <div class="image-caption" th:text="${news[0]} + ' 관련 이미지'">관련 이미지</div>

        <p th:text="${news[2]}">기사 본문 내용</p>
    </div>

    <div class="email-section">
        <h3>이 기사를 이메일로 전송하기</h3>
        <form class="email-form" onsubmit="sendEmail(event)">
            <input type="email" id="emailInput" placeholder="이메일 주소 입력" required th:value="${session.loginMember != null ? session.loginMember.email : ''}">
            <button type="submit">전송</button>
        </form>
    </div>

    <a href="/" class="back-link">메인 홈으로 돌아가기</a>
</main>

<script>
    function sendEmail(event) {
        event.preventDefault();
        alert("이메일로 전송되었습니다!");
        document.getElementById('emailInput').value = '';
    }
</script>
</body>
</html>
